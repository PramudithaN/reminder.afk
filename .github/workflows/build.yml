name: Build and Release Desktop Applications

on:
  push:
    branches: [ main, master, feat-PramudithaN ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published, created ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build Web & Main Bundle
        run: npx vite build

      - name: Package macOS Applications (DMG & ZIP)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --publish never

      - name: Package Windows Applications (NSIS & Portable)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never

      - name: Upload macOS Build Artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Binaries
          path: |
            release/*/*.dmg
            release/*/*.zip
          if-no-files-found: error

      - name: Upload Windows Build Artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Binaries
          path: |
            release/*/*.exe
            !release/**/win-unpacked/**
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build]
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macOS-Binaries
          path: release-assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Windows-Binaries
          path: release-assets

      - name: Publish Release using Official GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          echo "Publishing assets for tag: $TAG"
          
          # Find only final installer files (excluding unpacked directories)
          FILES=$(find release-assets -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.exe" \) ! -path "*/win-unpacked/*" ! -path "*/mac/*" ! -path "*/mac-arm64/*")
          echo "Final installer files to attach:"
          echo "$FILES"

          if [ -z "$FILES" ]; then
            echo "Error: No release files found."
            exit 1
          fi

          # Ensure the release exists first
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Creating new release $TAG..."
            gh release create "$TAG" --generate-notes
          fi

          # Upload each unique artifact individually with --clobber
          for FILE in $FILES; do
            echo "Uploading $FILE..."
            gh release upload "$TAG" "$FILE" --clobber
          done

          echo "Successfully published all release assets for $TAG!"
